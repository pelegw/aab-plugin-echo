[project]
name = "aab-plugin-echo"
dynamic = ["version"]
description = "The echo test plugin as an external Agent Authority Broker plugin (acceptance-test fixture)"
requires-python = ">=3.12"
dependencies = ["aab-plugin-runtime>=0.3.0,<1", "pyyaml>=6,<7", "uvicorn>=0.30,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>[0-9]+[.][0-9]+[.][0-9]+)"

[tool.hatch.build.targets.wheel]
packages = ["aab_plugin_echo"]
